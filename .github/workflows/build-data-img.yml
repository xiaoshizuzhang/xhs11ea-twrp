name: Build f2fs data.img
on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: '镜像大小 MB（实际数据约130MB，建议1024起）'
        required: false
        default: '1024'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install f2fs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y f2fs-tools
          # runner 内核可能未加载 f2fs 模块，确保支持
          sudo modprobe f2fs 2>/dev/null || sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe f2fs 2>/dev/null || echo "WARN: f2fs module unavailable"
          grep f2fs /proc/filesystems

      - name: Create & format f2fs image
        run: |
          SIZE=${{ github.event.inputs.size_mb }}
          dd if=/dev/zero of=data.img bs=1M count=$SIZE status=progress
          mkfs.f2fs -f data.img

      - name: Mount & extract tar (python tarfile, keep owner)
        run: |
          sudo mkdir -p /mnt/d
          sudo mount -o loop data.img /mnt/d
          # python tarfile 能完整读 busybox tar（937 条目）并保留 owner/mode
          sudo python3 - <<'EOF'
          import tarfile
          src = tarfile.open('data_clean.tar.gz', 'r:gz')
          src.extractall('/mnt/d')
          src.close()
          print('extractall done')
          EOF
          echo "entries_before_clean: $(sudo find /mnt/d -mindepth 1 | wc -l)"
          # 跨设备/同设备恢复都不带硬件绑定密钥目录
          sudo rm -rf /mnt/d/unencrypted /mnt/d/misc/keystore /mnt/d/misc/gatekeeper
          echo "entries_after_clean: $(sudo find /mnt/d -mindepth 1 | wc -l)"
          # busybox tar 1.18.3 的这两个条目头不标准，tar 工具读不出内容，从仓库文件补回
          sudo install -D -m 600 -o 1000 -g 1000 settings_secure.xml /mnt/d/system/users/0/settings_secure.xml
          sudo install -D -m 640 -o 1000 -g 2000 adb_keys /mnt/d/misc/adb/adb_keys
          echo "DIAG pwd: $(pwd)"
          echo "DIAG src settings: $(ls -la settings_secure.xml 2>&1 | head -1)"
          echo "DIAG src adb_keys: $(ls -la adb_keys 2>&1 | head -1)"
          echo "DIAG dst dir: $(ls -la /mnt/d/system/users/0/ 2>&1 | head -6)"
          echo "DIAG dst file: $(ls -la /mnt/d/system/users/0/settings_secure.xml 2>&1 | head -1)"
          echo "system: $(sudo find /mnt/d/system -mindepth 1 | wc -l)"
          echo "app: $(sudo find /mnt/d/app -mindepth 1 | wc -l)"
          echo "data: $(sudo find /mnt/d/data -mindepth 1 | wc -l)"
          echo "misc: $(sudo find /mnt/d/misc -mindepth 1 | wc -l)"
          echo "settings_secure exists: $(sudo test -f /mnt/d/system/users/0/settings_secure.xml && echo YES || echo NO)"
          echo "adb_keys exists: $(sudo test -f /mnt/d/misc/adb/adb_keys && echo YES || echo NO)"
          echo "FINAL ls: $(sudo ls -la /mnt/d/system/users/0/settings_secure.xml /mnt/d/misc/adb/adb_keys 2>&1)"
          sudo umount /mnt/d

      - name: Compress & upload artifact
        run: |
          gzip -9 data.img
          ls -la data.img.gz

      - uses: actions/upload-artifact@v4
        with:
          name: data-img
          path: data.img.gz
          retention-days: 7
