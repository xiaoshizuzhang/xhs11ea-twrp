name: Build TWRP for Seewo XHS11-EA (A133)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc \
            python3 python3-pip repo lz4 zstd m4

      - name: Set up repo workspace
        run: |
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated
          repo sync -c -j8 --no-tags --no-clone-bundle

      - name: Inject device tree
        run: |
          mkdir -p $HOME/twrp/device/ceres
          cp -r $GITHUB_WORKSPACE/device/ceres/xhs11ea $HOME/twrp/device/ceres/
          ls -la $HOME/twrp/device/ceres/xhs11ea/

      - name: Build sn_tool (source-tree gcc, strip-debug)
        run: |
          cd $HOME/twrp/device/ceres/xhs11ea
          TOOLCHAIN=$HOME/twrp/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          ls -la $TOOLCHAIN/bin/ | head -10
          $TOOLCHAIN/bin/arm-linux-androideabi-gcc -O2 -static -o sn_tool sn_tool.c
          $TOOLCHAIN/bin/arm-linux-androideabi-strip --strip-debug sn_tool
          ls -la sn_tool
          file sn_tool

      - name: Build recovery image
        run: |
          cd $HOME/twrp
          source build/envsetup.sh
          lunch omni_xhs11ea-eng
          mka recoveryimage 2>&1 | tee $HOME/build.log
          ls -la out/target/product/xhs11ea/recovery.img

      - name: Upload recovery.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-xhs11ea
          path: $HOME/twrp/out/target/product/xhs11ea/recovery.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: $HOME/build.log
          if-no-files-found: ignore
