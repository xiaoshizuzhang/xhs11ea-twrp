name: Build TWRP for Seewo XHS11-EA (A133)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc \
            python3 python3-pip repo lz4 zstd m4

      - name: Set up repo workspace
        run: |
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated
          cd $HOME/twrp/.repo/manifests
          git config user.name "ci-builder"
          git config user.email "ci@localhost"
          python3 - <<'EOF'
          import glob
          targets = ["platform/hardware/interfaces",
                     "platform/frameworks/hardware/interfaces",
                     "platform/system/hardware/interfaces"]
          total = 0
          for p in glob.glob("*.xml") + glob.glob("**/*.xml", recursive=True):
              s = open(p, encoding="utf-8").read()
              out = []
              removed = 0
              for ln in s.splitlines():
                  if ("<project" in ln or "<remove-project" in ln) and any(t in ln for t in targets):
                      removed += 1
                      continue
                  out.append(ln)
              if removed:
                  open(p, "w", encoding="utf-8").write("\n".join(out) + "\n")
                  print("edited", p, "removed", removed)
                  total += removed
          print("TOTAL_REMOVED_LINES", total)
          EOF
          git add -A
          git commit -m "drop hw interface repos (vts/hidl soong noise)"
          cd $HOME/twrp
          repo sync -c -j8 --no-tags --no-clone-bundle

      - name: Inject device tree
        run: |
          mkdir -p $HOME/twrp/device/ceres
          cp -r $GITHUB_WORKSPACE/device/ceres/xhs11ea $HOME/twrp/device/ceres/
          ls -la $HOME/twrp/device/ceres/xhs11ea/

      - name: Strip VTS/defaults test modules (never built for recovery)
        run: |
          echo "=== removing hw interface trees entirely (recovery has no HAL deps) ==="
          rm -rf $HOME/twrp/hardware/interfaces $HOME/twrp/frameworks/hardware/interfaces $HOME/twrp/system/hardware/interfaces
          ls -d $HOME/twrp/hardware/interfaces 2>&1 || echo "hardware/interfaces GONE"
          python3 - <<'EOF'
          import os
          removed = 0
          for dirpath, dirnames, filenames in os.walk("/home/runner/twrp"):
              if "/out" in dirpath or "/.repo" in dirpath or "/.git" in dirpath:
                  continue
              if "Android.bp" not in filenames:
                  continue
              p = os.path.join(dirpath, "Android.bp")
              try:
                  txt = open(p, encoding="utf-8", errors="ignore").read()
              except Exception:
                  continue
              if any(k in txt for k in ("VtsHal", "hidl_defaults", "system_suspend_defaults", "vts.driver", "vts.profiler")):
                  os.remove(p)
                  removed += 1
          print("TOTAL_REMOVED", removed)
          EOF
          echo "=== removing hidl_interface dirs under libhidl/transport (soong auto-generates vts variants) ==="
          python3 - <<'EOF'
          import os, shutil
          base = "/home/runner/twrp/system/libhidl/transport"
          targets = []
          for dirpath, dirnames, filenames in os.walk(base):
              if "Android.bp" not in filenames:
                  continue
              p = os.path.join(dirpath, "Android.bp")
              try:
                  txt = open(p, encoding="utf-8", errors="ignore").read()
              except Exception:
                  continue
              if "hidl_interface" in txt and not dirpath.endswith("/base"):
                  targets.append(dirpath)
          for t in targets:
              shutil.rmtree(t)
              print("RMTREE", t)
          print("TREE_REMOVED", len(targets))
          EOF
          echo "=== removing hidl test + nxp vendor trees ==="
          rm -rf $HOME/twrp/system/tools/hidl/test $HOME/twrp/hardware/nxp
          ls -d $HOME/twrp/system/tools/hidl/test $HOME/twrp/hardware/nxp 2>&1 || echo "hidl-test/nxp GONE"
          echo "=== removing external/bcc (bpf defaults not in minimal manifest) ==="
          rm -rf $HOME/twrp/external/bcc
          ls -d $HOME/twrp/external/bcc 2>&1 || echo "external/bcc GONE"
          echo "=== BIG PURGE: tests dirs + non-recovery trees (minimal manifest lacks prebuilt test libs) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          dels = []
          for dirpath, dirnames, filenames in os.walk(root):
              if "/out" in dirpath or "/.repo" in dirpath or "/.git" in dirpath:
                  continue
              if os.path.basename(dirpath) == "tests":
                  dels.append(dirpath)
                  dirnames[:] = []
          extra = [
              "cts", "frameworks/av", "art", "external/ukey2", "external/libbrillo",
              "hardware/ti", "system/security/keystore-engine", "build/make/tools/apicheck",
              "prebuilts/misc/common/androidx-test", "frameworks/opt/car",
              "development/tools/bugreport", "system/core/libgrallocusage",
              "frameworks/native/services/sensorservice", "frameworks/native/libs/ui/tests",
              "frameworks/base/tests", "frameworks/base/core/tests",
              "frameworks/base/services/coverage", "frameworks/base/services/core/xsd",
              "frameworks/base/cmds/statsd/tools", "packages/modules/ExtServices",
              "packages/services/AlternativeNetworkAccess", "libcore/metrictests",
              "system/tools/xsdc/tests", "frameworks/base/tests/net",
          ]
          gone = 0
          for d in dels:
              shutil.rmtree(d, ignore_errors=True); gone += 1
          for e in extra:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED_TOTAL", gone)
          EOF
          echo "=== removing art consumers (art tree gone => art_cc_* types undefined) ==="
          rm -rf $HOME/twrp/external/vixl $HOME/twrp/frameworks/native/cmds/installd/art_helper
          ls -d $HOME/twrp/external/vixl $HOME/twrp/frameworks/native/cmds/installd/art_helper 2>&1 || echo "vixl/art_helper GONE"
          echo "=== removing art-dex/py2/vts consumers ==="
          rm -rf $HOME/twrp/system/extras/simpleperf $HOME/twrp/test/vts $HOME/twrp/external/python/futures $HOME/twrp/frameworks/base/startop
          ls -d $HOME/twrp/system/extras/simpleperf $HOME/twrp/test/vts $HOME/twrp/external/python/futures $HOME/twrp/frameworks/base/startop 2>&1 || echo "dex/py2/vts consumers GONE"
          echo "=== removing perf profiling consumers ==="
          rm -rf $HOME/twrp/system/extras/perfprofd $HOME/twrp/external/perf_data_converter
          ls -d $HOME/twrp/system/extras/perfprofd $HOME/twrp/external/perf_data_converter 2>&1 || echo "perf consumers GONE"
          echo "=== removing remaining prebuilt-test/consumer trees ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra2 = [
              "dalvik/tools", "frameworks/base/packages/services/PacProcessor",
              "frameworks/native/services/bufferhub", "development/tools",
              "frameworks/native/libs/vr", "tools/test", "hardware/libhardware/modules",
              "external/icu/android_icu4j", "prebuilts/misc/common/android-support-test",
              "system/apex/apexd/apexd_testdata", "frameworks/native/services/surfaceflinger",
              "system/update_engine", "packages/apps/PackageInstaller",
              "frameworks/base/cmds/uiautomator", "prebuilts/misc/common/jacoco",
          ]
          gone = 0
          for e in extra2:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED2_TOTAL", gone)
          EOF
          echo "=== removing round-3 consumers (SystemUI/powermodel/libbpf/libbrillo/dalvik-dx) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra3 = [
              "frameworks/base/packages/SystemUI", "frameworks/base/packages/WAPPushManager",
              "frameworks/base/tools/powermodel", "frameworks/native/libs/cputimeinstate",
              "frameworks/native/services/nativeperms", "dalvik/dx",
              "bootable/recovery/updater_sample", "prebuilts/sdk/current/androidx",
          ]
          gone = 0
          for e in extra3:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED3_TOTAL", gone)
          EOF
          echo "=== removing round-4 consumers (nn/setupwizard/apifinder/vintf-xsd/carui/midi/healthd/rappor) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra4 = [
              "frameworks/ml", "frameworks/opt/setupwizard", "tools/apifinder",
              "system/libvintf/xsd", "frameworks/base/packages/CarSystemUI",
              "frameworks/base/media/native/midi", "system/core/healthd", "external/rappor",
          ]
          gone = 0
          for e in extra4:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED4_TOTAL", gone)
          EOF
          echo "=== removing round-5 consumers (vr/memtrack/dump-coverage/core-xsd/SettingsLib/headers/chips) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra5 = [
              "frameworks/native/services/vr", "system/core/libmemtrack",
              "frameworks/base/tools/dump-coverage", "frameworks/base/core/xsd",
              "frameworks/base/packages/SettingsLib", "frameworks/native/headers",
              "frameworks/opt/chips",
          ]
          gone = 0
          for e in extra5:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED5_TOTAL", gone)
          EOF
          echo "=== scrubbing okhttp/apache-xml refs from libcore/JavaLibrary.bp (libs not in minimal manifest) ==="
          python3 - <<'EOF'
          import re
          p = "/home/runner/twrp/libcore/JavaLibrary.bp"
          txt = open(p, encoding="utf-8", errors="ignore").read()
          n1 = len(re.findall(r'"okhttp"', txt))
          n2 = len(re.findall(r'"apache-xml"', txt))
          txt = re.sub(r'"okhttp",\s*', '', txt)
          txt = re.sub(r'"apache-xml",\s*', '', txt)
          open(p, "w", encoding="utf-8").write(txt)
          print("SCRUBBED okhttp", n1, "apache-xml", n2)
          EOF
          echo "=== removing round-6 consumers (EmergencyInfo -> SettingsLibDefaults) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra6 = ["packages/apps/EmergencyInfo"]
          gone = 0
          for e in extra6:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED6_TOTAL", gone)
          EOF
          echo "=== removing round-7 consumers (media2-jni/processors/UniversalMediaPlayer) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra7 = [
              "frameworks/base/media/jni", "frameworks/base/tools/processors",
              "packages/apps/UniversalMediaPlayer",
          ]
          gone = 0
          for e in extra7:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED7_TOTAL", gone)
          EOF
          echo "=== removing round-8 consumers (signapk/zipalign/conscrypt/drm/Stk/metalava/atrace/installd/icu-tools/skqp) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra8 = [
              "build/make/tools/signapk", "build/make/tools/zipalign", "external/conscrypt",
              "frameworks/base/drm", "packages/apps/Stk", "tools/metalava",
              "frameworks/native/cmds/atrace", "frameworks/native/cmds/installd",
              "external/icu/tools", "external/skqp",
          ]
          gone = 0
          for e in extra8:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED8_TOTAL", gone)
          EOF
          echo "=== scrubbing dead refs from frameworks/base/services/Android.bp ==="
          python3 - <<'EOF'
          import re
          p = "/home/runner/twrp/frameworks/base/services/Android.bp"
          txt = open(p, encoding="utf-8", errors="ignore").read()
          pats = ["services.coverage", "android.hidl.manager-V1.0-java", "android.hidl.base-V1.0-java"]
          total = 0
          for pat in pats:
              n = len(re.findall(re.escape(pat), txt))
              txt = re.sub(re.escape(pat) + r',\s*', '', txt)
              total += n
          open(p, "w", encoding="utf-8").write(txt)
          print("SERVICES_SCRUBBED", total)
          EOF
          echo "=== removing round-9 consumers (usbd/gsid/setupcompat) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra9 = ["system/core/usbd", "system/gsid", "external/setupcompat"]
          gone = 0
          for e in extra9:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED9_TOTAL", gone)
          EOF
          echo "=== scrubbing dead refs in round-9 bp files ==="
          python3 - <<'EOF'
          import re
          jobs = [
              ("/home/runner/twrp/libcore/JavaLibrary.bp", ["junit"]),
              ("/home/runner/twrp/frameworks/base/Android.bp", ["metalava-manual"]),
              ("/home/runner/twrp/hardware/libhardware/Android.bp", ["libbluetooth-types-header"]),
              ("/home/runner/twrp/system/apex/apexd/Android.bp", ["zipalign"]),
              ("/home/runner/twrp/system/timezone/distro/core/Android.bp", ["junit"]),
          ]
          for p, pats in jobs:
              txt = open(p, encoding="utf-8", errors="ignore").read()
              total = 0
              for pat in pats:
                  n = len(re.findall(re.escape(pat), txt))
                  txt = re.sub(re.escape(pat) + r',\s*', '', txt)
                  total += n
              open(p, "w", encoding="utf-8").write(txt)
              print("SCRUB", p.rsplit("/", 1)[-1], total)
          EOF
          echo "=== removing round-10 dirs (base/media, sdkparcelables, material-design-x) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra10 = [
              "frameworks/base/media", "frameworks/base/tools/sdkparcelables",
              "prebuilts/sdk/current/extras/material-design-x",
          ]
          gone = 0
          for e in extra10:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED10_TOTAL", gone)
          EOF
          echo "=== scrubbing libandroid_runtime dead deps in core/jni ==="
          python3 - <<'EOF'
          import re
          p = "/home/runner/twrp/frameworks/base/core/jni/Android.bp"
          txt = open(p, encoding="utf-8", errors="ignore").read()
          dead = ["libgif","libgrallocusage","libbpf_android","libmemtrack","libcamera_client",
                  "libhardware_legacy","libmedia","libmedia_helper","libmediametrics",
                  "libaudioclient","libaudiopolicy","libjpeg","libharfbuzz_ng","libpdfium",
                  "libimg_utils","libsoundtrigger","libminikin"]
          total = 0
          for d in dead:
              n = len(re.findall(re.escape(d), txt))
              txt = re.sub(re.escape(d) + r',\s*', '', txt)
              total += n
          open(p, "w", encoding="utf-8").write(txt)
          print("CORE_JNI_SCRUBBED", total)
          EOF
          echo "=== removing round-11 dirs (apct-tests/DeskClock/FusedLocation/devicepolicy/aapt2-tests) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra11 = [
              "frameworks/base/apct-tests", "packages/apps/DeskClock",
              "frameworks/base/packages/FusedLocation", "frameworks/base/services/devicepolicy",
              "frameworks/base/tools/aapt2/integration-tests",
          ]
          gone = 0
          for e in extra11:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED11_TOTAL", gone)
          EOF
          echo "=== global scrub: updatable_media_stubs + androidx.* + hidl-java (never pulled by minimal manifest) ==="
          python3 - <<'EOF'
          import os, re
          root = "/home/runner/twrp"
          pats = [
              r'"updatable_media_stubs",\s*',
              r'"androidx\.[^"]+",\s*',
              r'"android\.hardware\.configstore-V1\.0-java",\s*',
              r'"android\.hardware\.contexthub-V1\.0-java",\s*',
              r'"android\.hidl\.manager-V1\.2-java",\s*',
              r'"vendor\.omni\.biometrics\.fingerprint\.inscreen-V1\.0-java",\s*',
          ]
          total = 0
          for dp, dn, files in os.walk(root):
              if dn and dn[0].startswith('.'): continue
              for fn in files:
                  if not fn.endswith('.bp'): continue
                  p = os.path.join(dp, fn)
                  txt = open(p, encoding="utf-8", errors="ignore").read()
                  n0 = total
                  for pat in pats:
                      txt, n = re.subn(pat, '', txt)
                      total += n
                  if total != n0:
                      open(p, "w", encoding="utf-8").write(txt)
          print("GLOBAL_SCRUBBED", total)
          EOF
          echo "=== removing round-12 dirs (androidx-legacy prebuilt, ub-uiautomator) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra12 = [
              "prebuilts/sdk/current/androidx-legacy", "prebuilts/misc/common/ub-uiautomator",
          ]
          gone = 0
          for e in extra12:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED12_TOTAL", gone)
          EOF
          echo "=== removing round-13 dirs (services/apps/tools referencing dead test libs) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra13 = [
              "frameworks/base/packages/StatementService", "frameworks/base/services/midi",
              "frameworks/base/services/appprediction", "frameworks/base/cmds/bmgr",
              "frameworks/base/packages/OsuLogin", "frameworks/base/test-base",
              "frameworks/base/services/companion", "tools/apkzlib",
              "frameworks/base/libs/usb", "system/timezone/distro/installer",
          ]
          gone = 0
          for e in extra13:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED13_TOTAL", gone)
          EOF
          echo "=== injecting updatable_media_stubs stub (media tree purged) ==="
          mkdir -p /home/runner/twrp/frameworks/base/media
          printf 'java_library {\n    name: "updatable_media_stubs",\n    srcs: [],\n}\n' > /home/runner/twrp/frameworks/base/media/Android.bp
          echo "=== removing round-14 dirs (grpc/fastdeploy/test-runner) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra14 = [
              "external/grpc-grpc-java", "system/core/adb/fastdeploy",
              "frameworks/base/test-runner",
          ]
          gone = 0
          for e in extra14:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED14_TOTAL", gone)
          EOF
          echo "=== removing round-15 dirs (SettingsProvider/NetworkStack/startop/apexer/vulkan/vendor-qcom) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra15 = [
              "frameworks/base/packages/SettingsProvider", "packages/modules/NetworkStack",
              "frameworks/base/services/startop", "system/apex/apexer",
              "frameworks/native/vulkan", "vendor/qcom",
          ]
          gone = 0
          for e in extra15:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED15_TOTAL", gone)
          EOF
          echo "=== dropping updatable_media_stubs stub (self-dep loop in old soong) ==="
          rm -f /home/runner/twrp/frameworks/base/media/Android.bp
          rmdir /home/runner/twrp/frameworks/base/media 2>/dev/null || true
          echo "=== removing round-16 dirs (Car/tensorflow) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra16 = ["packages/apps/Car", "external/tensorflow"]
          gone = 0
          for e in extra16:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED16_TOTAL", gone)
          EOF
          echo "=== removing round-17 dirs (all modules still refs updatable_media_stubs / dead libs) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          extra17 = [
              "frameworks/base/cmds/media", "frameworks/base/packages/ExternalStorageProvider",
              "frameworks/base/services/contentsuggestions", "frameworks/base/obex",
              "frameworks/base/packages/CompanionDeviceManager", "frameworks/base/services/backup",
              "frameworks/base/services/restrictions", "system/apex/apexd/sysprop",
              "external/perfetto/test/cts", "external/turbine", "system/core/gatekeeperd",
          ]
          gone = 0
          for e in extra17:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED17_TOTAL", gone)
          EOF
          echo "=== targeted scrub: libhardware (bluetooth header) + nativewindow (grallocusage/graphics) ==="
          python3 - <<'EOF'
          import re
          jobs = [
              ("/home/runner/twrp/hardware/libhardware/Android.bp",
               ["libbluetooth-types-header"]),
              ("/home/runner/twrp/frameworks/native/libs/nativewindow/Android.bp",
               ["libgrallocusage", "android.hardware.graphics.common@1.1"]),
          ]
          for p, names in jobs:
              txt = open(p, encoding="utf-8", errors="ignore").read()
              orig = txt
              for n in names:
                  txt = re.sub(r'":?' + re.escape(n) + r'"(?:,\s*)?', '', txt)
                  txt = re.sub(r'\["?:?' + re.escape(n) + r'"?,?\s*\]', '[]', txt)
              open(p, "w", encoding="utf-8").write(txt)
              left = sum(txt.count(n) for n in names)
              print("TARGET", p.rsplit("/", 1)[-1], "changed", len(orig) != len(txt), "left", left)
          EOF
          echo "=== residual check ==="
          grep -rl "updatable_media_stubs" /home/runner/twrp --include="*.bp" 2>/dev/null || echo NO_MEDIA_STUB_REFS
          grep -rl "libbluetooth-types-header" /home/runner/twrp --include="*.bp" 2>/dev/null || echo NO_BT_HEADER_REFS
          echo "strip done"

      - name: Verify sn_tool prebuilt
        run: |
          ls -la $HOME/twrp/device/ceres/xhs11ea/sn_tool
          file $HOME/twrp/device/ceres/xhs11ea/sn_tool

      - name: Build recovery image
        run: |
          set +e
          cd $HOME/twrp
          source build/envsetup.sh > $HOME/env.log 2>&1
          echo "envsetup rc=$?"
          tail -20 $HOME/env.log
          lunch omni_xhs11ea-eng > $HOME/lunch.log 2>&1
          echo "lunch rc=$?"
          tail -40 $HOME/lunch.log
          mka recoveryimage 2>&1 | tee $HOME/build.log
          echo "mka rc=${PIPESTATUS[0]}"
          ls -la out/target/product/xhs11ea/recovery.img
          if [ ! -f out/target/product/xhs11ea/recovery.img ]; then exit 1; fi

      - name: Upload recovery.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-xhs11ea
          path: $HOME/twrp/out/target/product/xhs11ea/recovery.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: $HOME/build.log
          if-no-files-found: ignore
