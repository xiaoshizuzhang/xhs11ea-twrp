name: Build TWRP for Seewo XHS11-EA (A133)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc \
            python3 python3-pip repo lz4 zstd m4

      - name: Set up repo workspace
        run: |
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated
          cd $HOME/twrp/.repo/manifests
          git config user.name "ci-builder"
          git config user.email "ci@localhost"
          python3 - <<'EOF'
          import glob
          targets = ["platform/hardware/interfaces",
                     "platform/frameworks/hardware/interfaces",
                     "platform/system/hardware/interfaces"]
          total = 0
          for p in glob.glob("*.xml") + glob.glob("**/*.xml", recursive=True):
              s = open(p, encoding="utf-8").read()
              out = []
              removed = 0
              for ln in s.splitlines():
                  if ("<project" in ln or "<remove-project" in ln) and any(t in ln for t in targets):
                      removed += 1
                      continue
                  out.append(ln)
              if removed:
                  open(p, "w", encoding="utf-8").write("\n".join(out) + "\n")
                  print("edited", p, "removed", removed)
                  total += removed
          print("TOTAL_REMOVED_LINES", total)
          EOF
          git add -A
          git commit -m "drop hw interface repos (vts/hidl soong noise)"
          cd $HOME/twrp
          repo sync -c -j8 --no-tags --no-clone-bundle

      - name: Inject device tree
        run: |
          mkdir -p $HOME/twrp/device/ceres
          cp -r $GITHUB_WORKSPACE/device/ceres/xhs11ea $HOME/twrp/device/ceres/
          ls -la $HOME/twrp/device/ceres/xhs11ea/

      - name: Strip VTS/defaults test modules (never built for recovery)
        run: |
          echo "=== removing hw interface trees entirely (recovery has no HAL deps) ==="
          rm -rf $HOME/twrp/hardware/interfaces $HOME/twrp/frameworks/hardware/interfaces $HOME/twrp/system/hardware/interfaces
          ls -d $HOME/twrp/hardware/interfaces 2>&1 || echo "hardware/interfaces GONE"
          python3 - <<'EOF'
          import os
          removed = 0
          for dirpath, dirnames, filenames in os.walk("/home/runner/twrp"):
              if "/out" in dirpath or "/.repo" in dirpath or "/.git" in dirpath:
                  continue
              if "Android.bp" not in filenames:
                  continue
              p = os.path.join(dirpath, "Android.bp")
              try:
                  txt = open(p, encoding="utf-8", errors="ignore").read()
              except Exception:
                  continue
              if any(k in txt for k in ("VtsHal", "hidl_defaults", "system_suspend_defaults", "vts.driver", "vts.profiler")):
                  os.remove(p)
                  removed += 1
          print("TOTAL_REMOVED", removed)
          EOF
          echo "=== removing hidl_interface dirs under libhidl/transport (soong auto-generates vts variants) ==="
          python3 - <<'EOF'
          import os, shutil
          base = "/home/runner/twrp/system/libhidl/transport"
          targets = []
          for dirpath, dirnames, filenames in os.walk(base):
              if "Android.bp" not in filenames:
                  continue
              p = os.path.join(dirpath, "Android.bp")
              try:
                  txt = open(p, encoding="utf-8", errors="ignore").read()
              except Exception:
                  continue
              if "hidl_interface" in txt and not dirpath.endswith("/base"):
                  targets.append(dirpath)
          for t in targets:
              shutil.rmtree(t)
              print("RMTREE", t)
          print("TREE_REMOVED", len(targets))
          EOF
          echo "=== removing hidl test + nxp vendor trees ==="
          rm -rf $HOME/twrp/system/tools/hidl/test $HOME/twrp/hardware/nxp
          ls -d $HOME/twrp/system/tools/hidl/test $HOME/twrp/hardware/nxp 2>&1 || echo "hidl-test/nxp GONE"
          echo "=== removing external/bcc (bpf defaults not in minimal manifest) ==="
          rm -rf $HOME/twrp/external/bcc
          ls -d $HOME/twrp/external/bcc 2>&1 || echo "external/bcc GONE"
          echo "=== BIG PURGE: tests dirs + non-recovery trees (minimal manifest lacks prebuilt test libs) ==="
          python3 - <<'EOF'
          import os, shutil
          root = "/home/runner/twrp"
          dels = []
          for dirpath, dirnames, filenames in os.walk(root):
              if "/out" in dirpath or "/.repo" in dirpath or "/.git" in dirpath:
                  continue
              if os.path.basename(dirpath) == "tests":
                  dels.append(dirpath)
                  dirnames[:] = []
          extra = [
              "cts", "frameworks/av", "art", "external/ukey2", "external/libbrillo",
              "hardware/ti", "system/security/keystore-engine", "build/make/tools/apicheck",
              "prebuilts/misc/common/androidx-test", "frameworks/opt/car",
              "development/tools/bugreport", "system/core/libgrallocusage",
              "frameworks/native/services/sensorservice", "frameworks/native/libs/ui/tests",
              "frameworks/base/tests", "frameworks/base/core/tests",
              "frameworks/base/services/coverage", "frameworks/base/services/core/xsd",
              "frameworks/base/cmds/statsd/tools", "packages/modules/ExtServices",
              "packages/services/AlternativeNetworkAccess", "libcore/metrictests",
              "system/tools/xsdc/tests", "frameworks/base/tests/net",
          ]
          gone = 0
          for d in dels:
              shutil.rmtree(d, ignore_errors=True); gone += 1
          for e in extra:
              p = os.path.join(root, e)
              if os.path.isdir(p):
                  shutil.rmtree(p, ignore_errors=True); gone += 1
          print("PURGED_TOTAL", gone)
          EOF
          echo "strip done"

      - name: Verify sn_tool prebuilt
        run: |
          ls -la $HOME/twrp/device/ceres/xhs11ea/sn_tool
          file $HOME/twrp/device/ceres/xhs11ea/sn_tool

      - name: Build recovery image
        run: |
          set +e
          cd $HOME/twrp
          source build/envsetup.sh > $HOME/env.log 2>&1
          echo "envsetup rc=$?"
          tail -20 $HOME/env.log
          lunch omni_xhs11ea-eng > $HOME/lunch.log 2>&1
          echo "lunch rc=$?"
          tail -40 $HOME/lunch.log
          mka recoveryimage 2>&1 | tee $HOME/build.log
          echo "mka rc=${PIPESTATUS[0]}"
          ls -la out/target/product/xhs11ea/recovery.img
          if [ ! -f out/target/product/xhs11ea/recovery.img ]; then exit 1; fi

      - name: Upload recovery.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-xhs11ea
          path: $HOME/twrp/out/target/product/xhs11ea/recovery.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: $HOME/build.log
          if-no-files-found: ignore
